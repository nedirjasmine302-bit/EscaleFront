<!-- Section: Reset password -->
<section class="auth-page">
  <div class="auth-card scale-in">
    <span class="auth-eyebrow"><i class="bi bi-shield-check"></i> Nouveau mot de passe</span>
    <h2 class="auth-title">Changer de mot de passe</h2>
    <p class="auth-intro">Saisissez votre email, votre mot de passe temporaire, puis choisissez un nouveau mot de passe.</p>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="vous@exemple.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="temp-password">Mot de passe temporaire</label>
        <input type="password" id="temp-password" placeholder="Esc-xxxxxxxx" autocomplete="off">
      </div>

      <div class="field">
        <label for="password">Nouveau mot de passe</label>
        <input type="password" id="password" placeholder="Votre nouveau mot de passe" autocomplete="new-password">
      </div>

      <div class="field">
        <label for="password2">Confirmer le mot de passe</label>
        <input type="password" id="password2" placeholder="Retapez le mot de passe" autocomplete="new-password">
      </div>

      <p class="form-feedback" id="auth-feedback"></p>

      <button type="submit" class="btn btn-primary" id="reset-btn">Changer mon mot de passe</button>
    </form>
  </div>
</section>
