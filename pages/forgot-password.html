<!-- Section: Forgot password -->
<section class="auth-page">
  <div class="auth-card scale-in">
    <span class="auth-eyebrow"><i class="bi bi-key"></i> Mot de passe oublié</span>
    <h2 class="auth-title">Réinitialiser l'accès</h2>
    <p class="auth-intro">Indiquez votre email et votre pseudo : un mot de passe temporaire vous sera fourni par mail.</p>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="vous@exemple.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="pseudo">Pseudo</label>
        <input type="text" id="pseudo" placeholder="Votre pseudo" autocomplete="username">
      </div>

      <p class="form-feedback" id="auth-feedback"></p>

      <button type="submit" class="btn btn-primary" id="forgot-btn">Recevoir un mot de passe temporaire</button>
    </form>
  </div>
</section>
