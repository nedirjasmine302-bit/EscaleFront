<!-- Section: Sign up -->
<section class="auth-page">
  <div class="auth-card scale-in">
    <span class="auth-eyebrow"><i class="bi bi-person-plus"></i> Nouveau membre</span>
    <h2 class="auth-title">Créer un compte</h2>
    <p class="auth-intro">Créez votre compte pour enregistrer vos destinations favorites et être recontacté par nos conseillers.</p>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="vous@exemple.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="pseudo">Pseudo</label>
        <input type="text" id="pseudo" placeholder="3 à 20 caractères" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Votre mot de passe" autocomplete="new-password">
      </div>

      <div class="field">
        <label for="password2">Confirmer le mot de passe</label>
        <input type="password" id="password2" placeholder="Retapez le mot de passe" autocomplete="new-password">
      </div>

      <p class="form-feedback" id="auth-feedback"></p>

      <button type="submit" class="btn btn-primary" id="signup-btn">Créer mon compte</button>
    </form>
  </div>
</section>
